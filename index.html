<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBLOX</title>
    <style>
        @font-face {
            font-family: 'RobloxFont';
            src: url('/RobloxFont121Regular-axoyE.ttf') format('truetype');
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .title {
            color: white;
            font-size: 5rem;
            font-weight: bold;
            -webkit-text-stroke: 2px #fe1009;
            text-stroke: 2px #fe1009;
            font-family: 'RobloxFont', Arial, sans-serif;
        }
        .letter {
            display: inline-block;
            transition: color 1s ease;
        }
        .letter:nth-child(1) { animation: colorWave 6s infinite 0s; } /* W - blue */
        .letter:nth-child(2) { animation: colorWave 6s infinite 1s; } /* E - red */
        .letter:nth-child(3) { animation: colorWave 6s infinite 2s; } /* B - yellow */
        .letter:nth-child(4) { animation: colorWave 6s infinite 3s; } /* L - blue */
        .letter:nth-child(5) { animation: colorWave 6s infinite 4s; } /* O - green */
        .letter:nth-child(6) { animation: colorWave 6s infinite 5s; } /* X - red */

        @keyframes colorWave {
            0%, 100% { color: white; }
            25% { color: #4d85e2; }   /* blue for W and L */
            50% { color: #de5045; }   /* red for E and X */
            75% { color: #e6bd48; }   /* yellow for B */
        }
        .subtitle {
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
        }
        .press-prompt {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
        <div class="title">
            <span class="letter">W</span>
            <span class="letter">E</span>
            <span class="letter">B</span>
            <span class="letter">L</span>
            <span class="letter">O</span>
            <span class="letter">X</span>
        </div>
        <div class="subtitle">Websim Created Gaming</div>
        <div class="subtitle">Limitless Creation</div>
        <div class="press-prompt">Press Any Button To Begin</div>
    </div>
