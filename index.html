<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBLOX</title>
    <style>
        @font-face {
            font-family: 'RobloxFont';
            src: url('/RobloxFont121Regular-axoyE.ttf') format('truetype');
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .title {
            color: white;
            font-size: 5rem;
            font-weight: bold;
            -webkit-text-stroke: 2px #fe1009;
            text-stroke: 2px #fe1009;
            font-family: 'RobloxFont', Arial, sans-serif;
        }
        .title span {
            display: inline-block;
            transition: color 1.5s ease-in-out;
            animation-fill-mode: forwards;
            color: white;
            opacity: 1;
        }
        .title span:nth-child(1) { /* W */
            animation: colorWave1 2s ease-in-out infinite;
            animation-delay: 10s; /* Delayed to start after X finishes */
        }
        .title span:nth-child(2) { /* E */
            animation: colorWave2 2s ease-in-out infinite;
            animation-delay: 12s; /* Starts after W */
        }
        .title span:nth-child(3) { /* B */
            animation: colorWave3 2s ease-in-out infinite;
            animation-delay: 14s; /* Starts after E */
        }
        .title span:nth-child(4) { /* L */
            animation: colorWave4 2s ease-in-out infinite;
            animation-delay: 16s; /* Starts after B */
        }
        .title span:nth-child(5) { /* O */
            animation: colorWave5 2s ease-in-out infinite;
            animation-delay: 18s; /* Starts after L */
        }
        .title span:nth-child(6) { /* X */
            animation: colorWave6 2s ease-in-out infinite;
            animation-delay: 8s; /* Starts the sequence */
        }
        @keyframes colorWave1 {
            0%, 100% { color: white; }
            50% { color: #4d85e2; }
        }
        @keyframes colorWave2 {
            0%, 100% { color: white; }
            50% { color: #de5045; }
        }
        @keyframes colorWave3 {
            0%, 100% { color: white; }
            50% { color: #e6bd48; }
        }
        @keyframes colorWave4 {
            0%, 100% { color: white; }
            50% { color: #4d85e2; }
        }
        @keyframes colorWave5 {
            0%, 100% { color: white; }
            50% { color: #58a46c; }
        }
        @keyframes colorWave6 {
            0%, 100% { color: white; }
            50% { color: #de5045; }
        }
        .subtitle {
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
        }
        .press-prompt {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
        <div class="title">
            <span>W</span><span>E</span><span>B</span><span>L</span><span>O</span><span>X</span>
        </div>
        <div class="subtitle">Websim Created Gaming</div>
        <div class="subtitle">Limitless Creation</div>
        <div class="press-prompt">Press Any Button To Begin</div>
    </div>

</html>
