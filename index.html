<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBLOX</title>
    <style>
        @font-face {
            font-family: 'RobloxFont';
            src: url('/RobloxFont121Regular-axoyE.ttf') format('truetype');
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars from 3D scene */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #splash-background-overlay { /* New ID for the fading background image */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/weblox_background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10; /* Ensure it's on top of the canvas initially */
            transition: opacity 2s ease-in-out; /* Smooth fade out */
        }
        #splash-background-overlay.fade-out {
            opacity: 0;
            pointer-events: none; /* Make it unclickable after fade */
        }
        #title-text-overlay { /* New ID for the persistent text overlay */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* To stack title and subtitles */
            z-index: 15; /* Ensure it's on top of the fading background and canvas */
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block; /* Remove extra space below canvas */
            z-index: 5; /* Below splash screen and title overlay */
        }
        .title {
            color: white;
            font-size: 5rem;
            font-weight: bold;
            -webkit-text-stroke: 2px #fe1009;
            text-stroke: 2px #fe1009;
            font-family: 'RobloxFont', Arial, sans-serif;
        }
        .title span {
            display: inline-block;
            transition: color 1.5s ease-in-out;
        }
        .title span:nth-child(1) { /* W */
            animation: colorWave1 4s infinite;
        }
        .title span:nth-child(2) { /* E */
            animation: colorWave2 4s infinite;
        }
        .title span:nth-child(3) { /* B */
            animation: colorWave3 4s infinite;
        }
        .title span:nth-child(4) { /* L */
            animation: colorWave4 4s infinite;
        }
        .title span:nth-child(5) { /* O */
            animation: colorWave5 4s infinite;
        }
        .title span:nth-child(6) { /* X */
            animation: colorWave6 4s infinite;
        }
        @keyframes colorWave1 {
            0%, 100% { color: white; }
            50% { color: #4d85e2; }
        }
        @keyframes colorWave2 {
            0%, 100% { color: white; }
            50% { color: #de5045; }
        }
        @keyframes colorWave3 {
            0%, 100% { color: white; }
            50% { color: #e6bd48; }
        }
        @keyframes colorWave4 {
            0%, 100% { color: white; }
            50% { color: #4d85e2; }
        }
        @keyframes colorWave5 {
            0%, 100% { color: white; }
            50% { color: #58a46c; }
        }
        @keyframes colorWave6 {
            0%, 100% { color: white; }
            50% { color: #de5045; }
        }
        .subtitle {
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
        }
        .press-prompt {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="three-canvas"></canvas>
    <div id="splash-background-overlay"></div> <!-- This div will hold the background image and fade out -->
    <div id="title-text-overlay"> <!-- This div will hold the text and remain visible -->
        <div>
            <div class="title">
                <span>W</span><span>E</span><span>B</span><span>L</span><span>O</span><span>X</span>
            </div>
            <div class="subtitle">Websim Created Gaming</div>
            <div class="subtitle">Limitless Creation</div>
            <div class="press-prompt">Press Any Button To Begin</div>
        </div>
    </div>
    <script type="module" src="/main.js"></script>

</body>
</html>
