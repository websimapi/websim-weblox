<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBLOX</title>
    <script async src="https://unpkg.com/es-module-shims@1.7.2/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    <style>
        @font-face {
            font-family: 'RobloxFont';
            src: url('/RobloxFont121Regular-axoyE.ttf') format('truetype');
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
        }
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .title {
            color: white;
            font-size: 5rem;
            font-weight: bold;
            -webkit-text-stroke: 2px #fe1009;
            text-stroke: 2px #fe1009;
            font-family: 'RobloxFont', Arial, sans-serif;
        }
        .title span {
            display: inline-block;
            transition: color 1.5s ease-in-out;
        }
        .title span:nth-child(1) { /* W */
            animation: colorWave1 4s infinite;
        }
        .title span:nth-child(2) { /* E */
            animation: colorWave2 4s infinite;
        }
        .title span:nth-child(3) { /* B */
            animation: colorWave3 4s infinite;
        }
        .title span:nth-child(4) { /* L */
            animation: colorWave4 4s infinite;
        }
        .title span:nth-child(5) { /* O */
            animation: colorWave5 4s infinite;
        }
        .title span:nth-child(6) { /* X */
            animation: colorWave6 4s infinite;
        }
        @keyframes colorWave1 {
            0%, 100% { color: white; }
            50% { color: #4d85e2; }
        }
        @keyframes colorWave2 {
            0%, 100% { color: white; }
            50% { color: #de5045; }
        }
        @keyframes colorWave3 {
            0%, 100% { color: white; }
            50% { color: #e6bd48; }
        }
        @keyframes colorWave4 {
            0%, 100% { color: white; }
            50% { color: #4d85e2; }
        }
        @keyframes colorWave5 {
            0%, 100% { color: white; }
            50% { color: #58a46c; }
        }
        @keyframes colorWave6 {
            0%, 100% { color: white; }
            50% { color: #de5045; }
        }
        .subtitle {
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
        }
        .press-prompt {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>
    <div class="content">
        <div class="title">
            <span>W</span><span>E</span><span>B</span><span>L</span><span>O</span><span>X</span>
        </div>
        <div class="subtitle">Websim Created Gaming</div>
        <div class="subtitle">Limitless Creation</div>
        <br><br><br>
        <br><br><br>
        <div class="press-prompt">Press Any Button To Begin</div>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const canvas = document.getElementById('background-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Cloud shader material
        const cloudMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec2 resolution;
                varying vec2 vUv;

                float random(vec2 st) {
                    return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
                }

                float noise(vec2 st) {
                    vec2 i = floor(st);
                    vec2 f = fract(st);
                    float a = random(i);
                    float b = random(i + vec2(1.0, 0.0));
                    float c = random(i + vec2(0.0, 1.0));
                    float d = random(i + vec2(1.0, 1.0));
                    vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
                }

                void main() {
                    vec2 st = vUv * 5.0;
                    float t = time * 0.2;
                    
                    float n = noise(st + t);
                    float cloudDensity = smoothstep(0.5, 0.7, n);
                    
                    vec3 cloudColor = vec3(1.0, 1.0, 1.0);
                    cloudColor *= cloudDensity;
                    cloudColor.a = cloudDensity;
                    
                    gl_FragColor = vec4(cloudColor, cloudDensity * 0.5);
                }
            `,
            transparent: true
        });

        const cloudGeometry = new THREE.PlaneGeometry(10, 10);
        const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
        scene.add(cloudMesh);

        camera.position.z = 5;

        // Render loop
        function animate(time) {
            requestAnimationFrame(animate);
            cloudMaterial.uniforms.time.value = time * 0.001;
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cloudMaterial.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
